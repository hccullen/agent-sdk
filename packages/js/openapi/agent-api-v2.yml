              contextId: ctx.0192f4c8-3d6b-7c4f-a02b-4d9e7f3c8b51
              taskId: task.0192f4c8-4e7c-7d50-b13c-5eaf8a4d9c62
              role: ROLE_AGENT
              parts:
                - { text: J45.909 }
          artifacts:
            - artifactId: art.0192f4c8-6a9e-7f72-a35e-70c1ac6fbe84
