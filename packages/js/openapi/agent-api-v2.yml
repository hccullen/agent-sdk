openapi: 3.1.0
info:
  title: Corti Agent API v2
  version: 2.0.0
  summary: Manage agents and converse with them over the A2A v1.0 protocol.
  description: "Version 2 of the Corti Agents REST API.\n\n## What's new in v2\n\n- **Unified `connectors`** — a single, flat, discriminated array replaces the\n  v1 split between `experts`, `mcpServers`, and sub-agents. The envelope is\n  extensible: new connector kinds (`a2a`, `openapi`, `custom`) slot in behind\n  the `type` discriminator without breaking changes.\n- **Clean CRUD verbs** — `POST` creates, `GET` fetches/lists, `PATCH` performs\n  a *true* partial update, `DELETE` removes. v1's PATCH was effectively a PUT.\n- **First-class metadata** — `visibility`, `model`, `lifecycle` (now a body\n  field, not a query param), and free-form `labels`.\n\n## A2A v1.0 only\n\nThe conversational surface speaks **A2A protocol version `1.0` exclusively**\n(both the `JSONRPC` and `HTTP+JSON` bindings). The deprecated v0.3 binding from\nv1 is intentionally not carried forward.\n\nPer A2A §3.6, clients MUST send the `A2A-Version` header (`Major.Minor`, e.g.\n`1.0`) on every request to the `/a2a/*` surface, or supply it as the\n`A2A-Version` query parameter. This surface implements `1.0` only; an absent\nheader is treated as `1.0`. Patch versions MUST NOT be sent. The server echoes\nthe negotiated version in the `A2A-Version` response header.\n\n## Partial updates (PATCH)\n\n`PATCH` uses **JSON Merge Patch** semantics (RFC 7386), served under the\n`application/merge-patch+json` media type:\n\n- **Omit a field** → left unchanged.\n- **`null`** → cleared / reset to its default.\n- **Arrays** (e.g. `connectors`) → *replaced wholesale*, never merged.\n\nTo mutate a single connector without replacing the whole array, use the\n`/connectors` sub-resource endpoints.\n\n## Streaming (Server-Sent Events)\n\nThe streaming A2A surfaces — `message/stream`, `tasks/subscribe`, and the\nstreaming JSON-RPC methods — respond with `text/event-stream`. The\n`text/event-stream` media type carries a sequence of Server-Sent Events;\nthe attached schema describes a single event frame. Every event's `data`\nfield is a string carrying a JSON document (`contentMediaType:\napplication/json`); `contentSchema` declares the parsed payload\n(`StreamResponse` for the `HTTP+JSON` binding, `JSONRPCResponse` for the\n`JSONRPC` binding). The optional `id` field carries the SSE event id used\nfor resumption via the `Last-Event-ID` request header.\n"
  contact:
    {
      name: Corti API Support,
      url: "https://corti.ai",
      email: support@corti.ai,
    }
  license: { name: Proprietary, url: "https://corti.ai/terms" }
  termsOfService: https://corti.ai/terms
servers:
  - url: https://api.{env}.corti.app
    description: Corti regional API gateway
    variables:
      env:
        default: eu
        enum: [eu, us]
        description: Deployment region.
security:
  - bearerAuth: []
    tenantHeader: []
tags:
  - { name: Agents, description: "Create, read, update, and delete agents." }
  - { name: Agent Card, description: A2A-compliant agent discovery cards. }
  - {
      name: A2A,
      description: Converse with an agent over the A2A v1.0 protocol.,
    }
  - {
      name: Connectors,
      description: Manage the connectors attached to an agent.,
    }
  - { name: Usage, description: Bucketed invocation history for an agent. }
  - { name: Contexts, description: Conversational contexts and their tasks. }
  - {
      name: Registry,
      description: "Discoverable, pre-built connectors offered by the platform.",
    }
  - { name: Artifacts, description: Retrieve artifacts produced by tasks. }
  - {
      name: Feedback,
      description: Collect human or automated feedback on tasks and messages.,
    }
paths:
  /v2/agentic/agents:
    post:
      tags: [Agents]
      operationId: AgentsCreate
      summary: Create an agent
      description: Creates a new agent. The server assigns the UUIDv7 `id`.
      requestBody:
        required: true
        description: The agent to create.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentsCreateRequest" }
            examples:
              coder: { $ref: "#/components/examples/AgentCreateExample" }
      responses:
        "201":
          description: Agent created.
          headers:
            Location:
              description: Canonical URL of the created agent.
              schema: { type: string, format: uri }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    get:
      tags: [Agents]
      operationId: AgentsList
      summary: List agents
      description:
        "Lists agents visible to the caller. `private` agents are visible only to

        their creator/service principal; `unlisted` agents are omitted (fetch by

        ID instead); `public` agents are listed tenant-wide.

        The `visibility`, `lifecycle`, `label`, and `q` filter parameters are
        accepted but not yet honored by the server; the response is unfiltered.
        "
      parameters:
        - { $ref: "#/components/parameters/PageSize" }
        - { $ref: "#/components/parameters/PageToken" }
        - name: visibility
          in: query
          description: Filter by one or more visibility levels.
          required: false
          schema:
            type: array
            items: { $ref: "#/components/schemas/AgentsVisibility" }
          style: form
          explode: true
        - name: lifecycle
          in: query
          description: Filter by lifecycle.
          schema: { $ref: "#/components/schemas/AgentsLifecycle" }
        - name: label
          in: query
          description: "Filter by label equality, repeated `key=value` pairs (AND-combined)."
          required: false
          example: [team=coding]
          schema:
            type: array
            items:
              { type: string, pattern: "^[^=]+=[^=]*$", example: team=coding }
          style: form
          explode: true
        - name: q
          in: query
          description: Free-text search over `name` and `description`.
          example: coder
          schema: { type: string, maxLength: 256, example: coder }
      responses:
        "200":
          description: A page of agents.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentsListResponse" }
              example:
                {
                  agents:
                    [
                      {
                        id: agt.0192f4c8-2c5a-7b3e-9f1a-3c8d6e2b7a40,
                        name: coder,
                        visibility: private,
                        lifecycle: persistent,
                        createdAt: "2026-05-19T12:00:00Z",
                        updatedAt: "2026-05-19T12:00:00Z",
                        createdBy: usr.0192f4c8-8bc0-7194-8570-92e3ce81d0a6,
                        connectors: [],
                      },
                    ],
                }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v2/agentic/agents/{agentId}:
    parameters:
      - { $ref: "#/components/parameters/AgentId" }
    get:
      tags: [Agents]
      operationId: AgentsGet
      summary: Get an agent
      responses:
        "200":
          description: The agent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentsResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Agents]
      operationId: AgentsUpdate
      summary: Update an agent (partial)
      description:
        "Partially updates an agent using JSON Merge Patch (RFC 7386).

        Omitted fields are unchanged; `null` clears a field; arrays replace.

        "
      requestBody:
        required: true
        description: The fields to change, as a JSON Merge Patch (RFC 7386).
        content:
          application/merge-patch+json:
            schema: { $ref: "#/components/schemas/AgentsPatchRequest" }
            examples:
              renameAndRelabel:
                summary: Rename, clear the model override, replace connectors
                value:
                  name: coder-v2
                  model: null
                  connectors:
                    - { type: registry, name: "@dedalus/coding-expert" }
      responses:
        "200":
          description: The updated agent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      tags: [Agents]
      operationId: AgentsDelete
      summary: Delete an agent
      description:
        "Deletes a `persistent` agent. `ephemeral` agents are expired in place.

        Idempotent: deleting an already-deleted agent returns `204`.

        "
      responses:
        "204": { description: Agent deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v2/agentic/agents/{agentId}/.well-known/agent-card.json:
    parameters:
      - { $ref: "#/components/parameters/AgentId" }
    get:
      tags: [Agent Card]
      operationId: AgentCardGet
      summary: Get the A2A agent card
      description:
        "Returns the A2A v1.0 agent card describing the agent's capabilities,

        skills, and supported protocol interfaces. Served at the standard

        `.well-known` location for agent discovery.

        "
      responses:
        "200":
          description: The agent card.
          headers:
            A2A-Version: { $ref: "#/components/headers/A2AVersion" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentCardResponse" }
              examples:
                card: { $ref: "#/components/examples/AgentCardExample" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v2/agentic/agents/{agentId}/a2a:
    parameters:
      - { $ref: "#/components/parameters/AgentId" }
      - { $ref: "#/components/parameters/A2AVersionHeader" }
    post:
      tags: [A2A]
      operationId: A2AJsonRpc
      summary: A2A JSON-RPC binding
      description:
        "The `JSONRPC` protocol binding for A2A v1.0. Accepts a single JSON-RPC 2.0

        request whose `method` is one of `SendMessage`, `SendStreamingMessage`,

        `GetTask`, `ListTasks`, `CancelTask`, or `SubscribeToTask`.


        Streaming methods (`SendStreamingMessage`, `SubscribeToTask`) respond with

        `text/event-stream`; all others respond with a single JSON-RPC response.

        "
      requestBody:
        required: true
        description: A single JSON-RPC 2.0 request envelope.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/A2AJSONRPCRequest" }
            examples:
              messageSend:
                summary: SendMessage
                value:
                  jsonrpc: "2.0"
                  id: "1"
                  method: SendMessage
                  params:
                    message:
                      role: ROLE_USER
                      messageId: msg.0192f4c8-5f8d-7e61-924d-6fb09b5ead73
                      parts:
                        - { text: Code this encounter. }
      responses:
        "200":
          description:
            "A single JSON-RPC response (non-streaming methods), or an

            `text/event-stream` for the streaming methods (`SendStreamingMessage`,

            `SubscribeToTask`) where each event's `data` is a JSON-encoded

            `JSONRPCResponse`.

            "
          headers:
            A2A-Version: { $ref: "#/components/headers/A2AVersion" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/A2AJSONRPCResponse" }
              example:
                {
                  jsonrpc: "2.0",
                  id: msg-001,
                  result:
                    {
                      task:
                        {
                          id: task.0192f4c8-4e7c-7d50-b13c-5eaf8a4d9c62,
                          contextId: ctx.0192f4c8-3d6b-7c4f-a02b-4d9e7f3c8b51,
                          status: { state: TASK_STATE_COMPLETED },
                        },
                    },
                }
            text/event-stream:
              schema:
                { $ref: "#/components/schemas/A2AJSONRPCStreamEventResponse" }
              example:
                {
                  event: message,
                  data: '{"jsonrpc":"2.0","id":"msg-001","result":{"task":{"id":"task.0192f4c8-4e7c-7d50-b13c-5eaf8a4d9c62","contextId":"ctx.0192f4c8-3d6b-7c4f-a02b-4d9e7f3c8b51","status":{"state":"TASK_STATE_COMPLETED"}}}}',
                }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v2/agentic/agents/{agentId}/a2a/message:send:
    parameters:
      - { $ref: "#/components/parameters/AgentId" }
      - { $ref: "#/components/parameters/A2AVersionHeader" }
    post:
      tags: [A2A]
      operationId: A2ASendMessage
      summary: Send a message (A2A REST)
      description: The `HTTP+JSON` binding of A2A `SendMessage`.
      requestBody:
        required: true
        description: The message to send to the agent.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/A2ASendMessageRequest" }
            example:
              {
                message:
                  {
                    messageId: msg.0192f4c8-5f8d-7e61-924d-6fb09b5ead73,
                    role: ROLE_USER,
                    parts: [{ text: "What is the ICD-10 code for asthma?" }],
                  },
              }
      responses:
        "200":
          description: The resulting task or agent message.
          headers:
            A2A-Version: { $ref: "#/components/headers/A2AVersion" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/A2ASendMessageResponse" }
              examples:
                completedTask:
                  { $ref: "#/components/examples/SendMessageResponseExample" }
        "400": { $ref: "#/components/responses/A2ABadRequest" }
        "401": { $ref: "#/components/responses/A2AUnauthorized" }
        "404": { $ref: "#/components/responses/A2ANotFound" }
  /v2/agentic/agents/{agentId}/a2a/message:stream:
    parameters:
      - { $ref: "#/components/parameters/AgentId" }
      - { $ref: "#/components/parameters/A2AVersionHeader" }
    post:
      tags: [A2A]
      operationId: A2AStreamMessage
      summary: Stream a message (A2A REST)
      description:
        "The `HTTP+JSON` binding of A2A `SendStreamingMessage`. Responds with a

        `text/event-stream` of `Task`, `statusUpdate`, and `artifactUpdate` events.

        "
      requestBody:
        required: true
        description: The message to send to the agent.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/A2ASendMessageRequest" }
            example:
              {
                message:
                  {
                    messageId: msg.0192f4c8-5f8d-7e61-924d-6fb09b5ead73,
                    role: ROLE_USER,
                    parts: [{ text: "What is the ICD-10 code for asthma?" }],
                  },
              }
      responses:
        "200":
          description:
            "An SSE stream of streaming responses. Each event's `data` is a

            JSON-encoded `StreamResponse` (`Task`, `statusUpdate`, or

            `artifactUpdate`).

            "
          headers:
            A2A-Version: { $ref: "#/components/headers/A2AVersion" }
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/A2AStreamEventResponse" }
              example:
                {
                  event: message,
                  data: '{"task":{"id":"task.0192f4c8-4e7c-7d50-b13c-5eaf8a4d9c62","contextId":"ctx.0192f4c8-3d6b-7c4f-a02b-4d9e7f3c8b51","status":{"state":"TASK_STATE_WORKING"}}}',
                }
        "400": { $ref: "#/components/responses/A2ABadRequest" }
        "401": { $ref: "#/components/responses/A2AUnauthorized" }
        "404": { $ref: "#/components/responses/A2ANotFound" }
  /v2/agentic/agents/{agentId}/a2a/tasks:
    parameters:
      - { $ref: "#/components/parameters/AgentId" }
      - { $ref: "#/components/parameters/A2AVersionHeader" }
    get:
      tags: [A2A]
      operationId: A2AListTasks
      summary: List tasks (A2A REST)
      parameters:
        - { $ref: "#/components/parameters/PageSize" }
        - { $ref: "#/components/parameters/PageToken" }
        - name: contextId
          in: query
          description: Restrict to tasks within this context.
          schema: { type: string }
      responses:
        "200":
          description: A page of tasks.
          headers:
            A2A-Version: { $ref: "#/components/headers/A2AVersion" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommonTaskListResponse" }
              example:
                {
                  tasks:
                    [
                      {
                        id: task.0192f4c8-4e7c-7d50-b13c-5eaf8a4d9c62,
                        contextId: ctx.0192f4c8-3d6b-7c4f-a02b-4d9e7f3c8b51,
                        status: { state: TASK_STATE_COMPLETED },
                      },
                    ],
                }
        "401": { $ref: "#/components/responses/A2AUnauthorized" }
  /v2/agentic/agents/{agentId}/a2a/tasks/{taskId}:
    parameters:
      - { $ref: "#/components/parameters/AgentId" }
      - { $ref: "#/components/parameters/TaskId" }
      - { $ref: "#/components/parameters/A2AVersionHeader" }
    get:
      tags: [A2A]
      operationId: A2AGetTask
      summary: Get a task (A2A REST)
      parameters:
        - name: historyLength
          in: query
          description: Cap the number of history messages returned.
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: The task.
          headers:
            A2A-Version: { $ref: "#/components/headers/A2AVersion" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommonTaskResponse" }
              example:
                {
                  id: task.0192f4c8-4e7c-7d50-b13c-5eaf8a4d9c62,
                  contextId: ctx.0192f4c8-3d6b-7c4f-a02b-4d9e7f3c8b51,
                  status:
                    {
                      state: TASK_STATE_COMPLETED,
                      timestamp: "2026-05-19T12:00:01Z",
                    },
                }
        "401": { $ref: "#/components/responses/A2AUnauthorized" }
        "404": { $ref: "#/components/responses/A2ANotFound" }
  /v2/agentic/agents/{agentId}/a2a/tasks/{taskId}:cancel:
    parameters:
      - { $ref: "#/components/parameters/AgentId" }
      - { $ref: "#/components/parameters/TaskId" }
      - { $ref: "#/components/parameters/A2AVersionHeader" }
    post:
      tags: [A2A]
      operationId: A2ACancelTask
      summary: Cancel a task (A2A REST)
      responses:
        "200":
          description: The canceled task.
          headers:
            A2A-Version: { $ref: "#/components/headers/A2AVersion" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommonTaskResponse" }
              example:
                {
                  id: task.0192f4c8-4e7c-7d50-b13c-5eaf8a4d9c62,
                  contextId: ctx.0192f4c8-3d6b-7c4f-a02b-4d9e7f3c8b51,
                  status:
                    {
                      state: TASK_STATE_COMPLETED,
                      timestamp: "2026-05-19T12:00:01Z",
                    },
                }
        "401": { $ref: "#/components/responses/A2AUnauthorized" }
        "404": { $ref: "#/components/responses/A2ANotFound" }
        "409":
          description: Task is already in a final state and cannot be canceled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/A2AErrorResponse" }
  /v2/agentic/agents/{agentId}/a2a/tasks/{taskId}:subscribe:
    parameters:
      - { $ref: "#/components/parameters/AgentId" }
      - { $ref: "#/components/parameters/TaskId" }
      - { $ref: "#/components/parameters/A2AVersionHeader" }
    post:
      tags: [A2A]
      operationId: A2ASubscribeTask
      summary: Subscribe to task events (A2A REST)
      description: Resubscribe to an in-flight task's event stream over SSE.
      responses:
        "200":
          description:
            "An SSE stream of task events. Each event's `data` is a JSON-encoded
            `StreamResponse`. The server writes event ids but does not yet read
            the `Last-Event-ID` request header, so resumption without gaps is
            not implemented.
            "
          headers:
            A2A-Version: { $ref: "#/components/headers/A2AVersion" }
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/A2AStreamEventResponse" }
              example:
                {
                  id: task.0192f4c8-4e7c-7d50-b13c-5eaf8a4d9c62,
                  data: '{"statusUpdate":{"taskId":"task.0192f4c8-4e7c-7d50-b13c-5eaf8a4d9c62","contextId":"ctx.0192f4c8-3d6b-7c4f-a02b-4d9e7f3c8b51","status":{"state":"TASK_STATE_COMPLETED","timestamp":"2026-05-19T12:00:01Z"}}}',
                }
        "401": { $ref: "#/components/responses/A2AUnauthorized" }
        "404": { $ref: "#/components/responses/A2ANotFound" }
  /v2/agentic/agents/{agentId}/usage:
    parameters:
      - { $ref: "#/components/parameters/AgentId" }
    get:
      tags: [Usage]
      operationId: UsageGet
      summary: Get an agent's usage
      description:
        "Returns invocation metrics for the agent over the half-open `[from, to)`

        time range (UTC), bucketed at the requested `granularity`. The response

        echoes the resolved range and granularity, a `totals` summary across the

        whole range, and one `buckets` entry per period that had activity (the

        array is empty when there was none). When `from`/`to` are omitted, the

        range defaults to the last 30 days.

        "
      parameters:
        - name: from
          in: query
          description:
            "Inclusive start of the range, as an RFC 3339 timestamp (UTC).

            Defaults to 30 days before `to`. Must not be after `to`.

            "
          schema: { type: string, format: date-time }
          example: "2026-05-19T00:00:00Z"
        - name: to
          in: query
          description:
            "Exclusive end of the range, as an RFC 3339 timestamp (UTC).

            Defaults to the current time.

            "
          schema: { type: string, format: date-time }
          example: "2026-05-20T00:00:00Z"
        - name: granularity
          in: query
          description: Size of each reporting bucket. Defaults to `day`.
          schema: { $ref: "#/components/schemas/UsageGranularity" }
          example: day
      responses:
        "200":
          description: The agent's bucketed usage over the requested range.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsageReportResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v2/agentic/agents/{agentId}/connectors:
    parameters:
      - { $ref: "#/components/parameters/AgentId" }
    get:
      tags: [Connectors]
      operationId: ConnectorsList
      summary: List an agent's connectors
      responses:
        "200":
          description: The agent's connectors.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectorsListResponse" }
              example:
                {
                  connectors:
                    [
                      {
                        id: con.0192f4c8-7baf-7083-a46f-81d2bd70cf95,
                        type: registry,
                        name: "@dedalus/coding-expert",
                        enabled: true,
                      },
                    ],
                }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Connectors]
      operationId: ConnectorsAttach
      summary: Attach a connector
      requestBody:
        required: true
        description: The connector to attach to the agent.
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/CommonConnectorCreateRequest" }
            example: { type: registry, name: "@dedalus/coding-expert" }
      responses:
        "201":
          description: The attached connector.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommonConnectorResponse" }
              example:
                {
                  id: con.0192f4c8-7baf-7083-a46f-81d2bd70cf95,
                  type: registry,
                  name: "@dedalus/coding-expert",
                  enabled: true,
                }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v2/agentic/agents/{agentId}/connectors/{agentConnectorId}:
    parameters:
      - { $ref: "#/components/parameters/AgentId" }
      - { $ref: "#/components/parameters/AgentConnectorId" }
    get:
      tags: [Connectors]
      operationId: ConnectorsGet
      summary: Get an agent-scoped connector
      responses:
        "200":
          description: The connector.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommonConnectorResponse" }
              example:
                {
                  id: con.0192f4c8-7baf-7083-a46f-81d2bd70cf95,
                  type: registry,
                  name: "@dedalus/coding-expert",
                  enabled: true,
                }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Connectors]
      operationId: ConnectorsUpdate
      summary: Update an agent-scoped connector (partial)
      description:
        "Partially updates an agent-scoped connector using JSON Merge Patch

        (RFC 7386). `type` is immutable.

        **Future scope**:  not yet implemented; the server returns `501`.
        "
      x-status: planned
      requestBody:
        required: true
        description: The connector fields to change, as a JSON Merge Patch (RFC 7386).
        content:
          application/merge-patch+json:
            schema: { $ref: "#/components/schemas/ConnectorsPatchRequest" }
            example: { enabled: false }
      responses:
        "200":
          description: The updated connector.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommonConnectorResponse" }
              example:
                {
                  id: con.0192f4c8-7baf-7083-a46f-81d2bd70cf95,
                  type: registry,
                  name: "@dedalus/coding-expert",
                  enabled: true,
                }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501":
          description: Not yet implemented.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommonErrorResponse" }
    delete:
      tags: [Connectors]
      operationId: ConnectorsRemove
      summary: Remove a connector
      responses:
        "204": { description: Connector removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v2/agentic/contexts:
    get:
      tags: [Contexts]
      operationId: ContextsList
      summary: List contexts
      description: "Lists contexts matching the filters.

        **Future scope**: not yet implemented; the server currently returns an empty page and ignores all parameters.
        "
      x-status: planned
      parameters:
        - name: agentId
          in: query
          description: Restrict to contexts owned by this agent.
          schema: { type: string }
        - name: from
          in: query
          description: Inclusive lower bound on `createdAt` (RFC 3339).
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Exclusive upper bound on `createdAt` (RFC 3339).
          schema: { type: string, format: date-time }
        - { $ref: "#/components/parameters/PageSize" }
        - { $ref: "#/components/parameters/PageToken" }
      responses:
        "200":
          description: A page of contexts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContextsListResponse" }
              example:
                { contexts: [{ id: ctx.0192f4c8-3d6b-7c4f-a02b-4d9e7f3c8b51 }] }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v2/agentic/contexts/{contextId}:
    parameters:
      - { $ref: "#/components/parameters/ContextId" }
    get:
      tags: [Contexts]
      operationId: ContextsGet
      summary: Get a context
      description:
        "Returns the context's metadata together with its `tasks`, oldest first.

        Each task carries its full message `history`; the user's prompt for a

        task is the `ROLE_USER` message within that task's history (there is no

        separate top-level message list).

        "
      parameters:
        - name: historyLength
          in: query
          description: Cap the number of history messages returned per task.
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: The context and its tasks.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContextsDetailResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Contexts]
      operationId: ContextsDelete
      summary: Delete or expire a context
      responses:
        "204": { description: Context deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v2/agentic/contexts/{contextId}/trace:
    parameters:
      - { $ref: "#/components/parameters/ContextId" }
    get:
      tags: [Contexts]
      operationId: ContextsGetTrace
      summary: Export the observability trace for a context
      description:
        "Returns the execution traces for the context — LLM calls, tool

        executions, and token usage — in OpenInference format. Traces are

        ordered newest-first and paginated; each page returns up to `pageSize`

        traces with their spans inlined.

        "
      parameters:
        - { $ref: "#/components/parameters/PageSize" }
        - { $ref: "#/components/parameters/PageToken" }
      responses:
        "200":
          description: OpenInference trace JSON (paginated).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContextsTraceResponse" }
              example:
                {
                  traces:
                    [
                      {
                        trace:
                          {
                            id: "0192f4c85f3a7e8ab1c23d4e5f6a7b8c",
                            name: invoke_agent,
                            start_time: "2026-05-19T12:00:00Z",
                            thread_id: ctx.0192f4c8-3d6b-7c4f-a02b-4d9e7f3c8b51,
                          },
                        spans:
                          [
                            {
                              name: invoke_llm,
                              span_id: span.0192f4c8-6e1a-7f2b-9c3d-4e5f6a7b8c9d,
                              start_time: "2026-05-19T12:00:00Z",
                            },
                          ],
                      },
                    ],
                }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v2/agentic/contexts/{contextId}/tasks:
    parameters:
      - { $ref: "#/components/parameters/ContextId" }
    get:
      tags: [Contexts]
      operationId: ContextsListTasks
      summary: List tasks within a context
      parameters:
        - { $ref: "#/components/parameters/PageSize" }
        - { $ref: "#/components/parameters/PageToken" }
      responses:
        "200":
          description: A page of tasks.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommonTaskListResponse" }
              example:
                {
                  tasks:
                    [
                      {
                        id: task.0192f4c8-4e7c-7d50-b13c-5eaf8a4d9c62,
                        contextId: ctx.0192f4c8-3d6b-7c4f-a02b-4d9e7f3c8b51,
                        status: { state: TASK_STATE_COMPLETED },
                      },
                    ],
                }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v2/agentic/contexts/{contextId}/tasks/{taskId}:
    parameters:
      - { $ref: "#/components/parameters/ContextId" }
      - { $ref: "#/components/parameters/TaskId" }
    get:
      tags: [Contexts]
      operationId: ContextsGetTask
      summary: Get a task within a context
      responses:
        "200":
          description: The task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommonTaskResponse" }
              example:
                {
                  id: task.0192f4c8-4e7c-7d50-b13c-5eaf8a4d9c62,
                  contextId: ctx.0192f4c8-3d6b-7c4f-a02b-4d9e7f3c8b51,
                  status:
                    {
                      state: TASK_STATE_COMPLETED,
                      timestamp: "2026-05-19T12:00:01Z",
                    },
                }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v2/agentic/contexts/{contextId}/tasks/{taskId}/artifacts/{artifactId}:
    parameters:
      - { $ref: "#/components/parameters/ContextId" }
      - { $ref: "#/components/parameters/TaskId" }
      - { $ref: "#/components/parameters/ArtifactId" }
    get:
      tags: [Artifacts]
      operationId: ArtifactsGet
      summary: Get an artifact
      description:
        "Returns an artifact produced by a task within a context. File parts may

        carry inline `bytes` or a `uri` to fetch the content out of band.

        "
      responses:
        "200":
          description: The artifact.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommonArtifactResponse" }
              example:
                {
                  artifactId: art.0192f4c8-6a9e-7f72-a35e-70c1ac6fbe84,
                  name: icd10-result,
                  parts: [{ text: J45.909 }],
                }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v2/agentic/registry/connectors:
    get:
      tags: [Registry]
      operationId: RegistryList
      summary: List available registry connectors
      parameters:
        - name: q
          in: query
          x-status: planned
          description: "Free-text search over name and description.

            **Future scope**: not yet implemented; the server ignores this parameter and returns the unfiltered page.
            "
          schema: { type: string, maxLength: 256 }
        - { $ref: "#/components/parameters/PageSize" }
        - { $ref: "#/components/parameters/PageToken" }
      responses:
        "200":
          description: A page of registry connectors.
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/RegistryConnectorListResponse" }
              example:
                {
                  connectors:
                    [
                      {
                        id: "@dedalus/coding-expert",
                        type: registry,
                        name: coding-expert,
                      },
                    ],
                }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v2/agentic/registry/connectors/{connectorId}:
    parameters:
      - name: connectorId
        in: path
        required: true
        schema: { type: string }
        description: Registry connector identifier (e.g. `@dedalus/coding-expert`).
    get:
      tags: [Registry]
      operationId: RegistryGet
      summary: Get registry connector details and configuration schema
      responses:
        "200":
          description: The registry connector.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistryConnectorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v2/agentic/contexts/{contextId}/tasks/{taskId}/feedback:
    parameters:
      - { $ref: "#/components/parameters/ContextId" }
      - { $ref: "#/components/parameters/TaskId" }
    post:
      tags: [Feedback]
      operationId: FeedbackCreate
      summary: Submit feedback for a task
      description:
        "Submits feedback about a task as a whole or about a specific user-visible

        message within the task. The task must exist, belong to the supplied

        context, and belong to the authenticated customer. Multiple feedback

        resources may be submitted for the same task or message.

        "
      requestBody:
        required: true
        description: The feedback to submit.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeedbackCreateRequest" }
            examples:
              minimal:
                { $ref: "#/components/examples/FeedbackCreateMinimalExample" }
              detailed:
                { $ref: "#/components/examples/FeedbackCreateDetailedExample" }
      responses:
        "201":
          description: Feedback created.
          headers:
            Location:
              description: Canonical URL of the created feedback resource.
              schema: { type: string, format: uri }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedbackResponse" }
              example:
                {
                  id: fb.0192f4c8-9a3b-7e2f-9c4d-5a6b7c8d9e0f,
                  taskId: task.0192f4c8-4e7c-7d50-b13c-5eaf8a4d9c62,
                  rating: { scale: binary, value: 1 },
                  normalizedScore: 1.0,
                  labels: [],
                  createdAt: "2026-05-19T12:00:00Z",
                }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    get:
      tags: [Feedback]
      operationId: FeedbackList
      summary: List feedback for a task
      description:
        "Returns all feedback resources submitted for the task by the
        authenticated user, newest-first. The task must exist, belong to the
        supplied context, and belong to the authenticated customer. Feedback is
        scoped to the calling user via row-level security, so the response
        contains only that user's feedback.

        "
      responses:
        "200":
          description: A list of feedback resources.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedbackListResponse" }
              example:
                {
                  feedbacks:
                    [
                      {
                        id: fb.0192f4c8-9a3b-7e2f-9c4d-5a6b7c8d9e0f,
                        taskId: task.0192f4c8-4e7c-7d50-b13c-5eaf8a4d9c62,
                        rating: { scale: binary, value: 1 },
                        normalizedScore: 1.0,
                        labels: [],
                        createdAt: "2026-05-19T12:00:00Z",
                      },
                    ],
                }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Feedback]
      operationId: FeedbackDelete
      summary: Delete all feedback for a task
      description:
        "Soft-deletes every feedback resource the authenticated user submitted
        for the task. The task must exist, belong to the supplied context, and
        belong to the authenticated customer. Idempotent: deleting when there is
        no feedback returns `204`.

        "
      responses:
        "204":
          description: Feedback deleted, or there was no feedback to delete.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    bearerAuth:
      {
        type: http,
        scheme: bearer,
        bearerFormat: JWT,
        description: OAuth 2.0 / OIDC bearer token.,
      }
    tenantHeader:
      {
        type: apiKey,
        in: header,
        name: Tenant-Name,
        description: The tenant the request operates within.,
      }
  parameters:
    AgentId:
      name: agentId
      in: path
      required: true
      description: Agent identifier (prefixed UUIDv7).
      schema: { $ref: "#/components/schemas/CommonAgentIDValue" }
    AgentConnectorId:
      name: agentConnectorId
      in: path
      required: true
      description: Agent-scoped connector identifier (prefixed UUIDv7).
      schema: { $ref: "#/components/schemas/CommonConnectorIDValue" }
    ContextId:
      name: contextId
      in: path
      required: true
      description: Context identifier (prefixed UUIDv7).
      schema: { $ref: "#/components/schemas/CommonContextIDValue" }
    TaskId:
      name: taskId
      in: path
      required: true
      description: Task identifier (prefixed UUIDv7).
      schema: { $ref: "#/components/schemas/CommonTaskIDValue" }
    ArtifactId:
      name: artifactId
      in: path
      required: true
      description: Artifact identifier (prefixed UUIDv7).
      schema: { $ref: "#/components/schemas/CommonArtifactIDValue" }
    PageSize:
      name: pageSize
      in: query
      required: false
      description: Maximum number of items per page.
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    PageToken:
      name: pageToken
      in: query
      required: false
      description: Opaque cursor from a prior response's `nextPageToken`. Omit on the first request.
      schema: { type: string }
    A2AVersionHeader:
      name: A2A-Version
      in: header
      required: false
      description:
        "A2A protocol version in `Major.Minor` form (A2A §3.6). Optional;
        defaults to `1.0` when absent. This surface implements `1.0` only.
        Patch versions MUST NOT be sent and are not considered during
        negotiation."
      schema: { type: string, pattern: ^\d+\.\d+$, default: "1.0" }
  headers:
    A2AVersion:
      description: The A2A protocol `Major.Minor` version the server used to handle the request.
      schema:
        type: string
        examples: ["1.0"]
  responses:
    BadRequest:
      description: The request was malformed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CommonErrorResponse" }
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CommonErrorResponse" }
    Forbidden:
      description: The caller is not permitted to perform this action.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CommonErrorResponse" }
    NotFound:
      description: The resource does not exist or is not visible to the caller.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CommonErrorResponse" }
    Conflict:
      description: The request conflicts with the current state of the resource.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CommonErrorResponse" }
    UnprocessableEntity:
      description: The request was well-formed but semantically invalid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CommonErrorResponse" }
    A2ABadRequest:
      description: Malformed A2A request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/A2AErrorResponse" }
    A2AUnauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/A2AErrorResponse" }
    A2ANotFound:
      description: The agent, task, or context was not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/A2AErrorResponse" }
  schemas:
    CommonAgentIDValue:
      type: string
      format: agent-id
      description: Agent identifier. Accepts `agt.<uuidv7>` or a bare UUIDv7 on input; always returned prefixed.
      pattern: ^(agt\.)?[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      examples: [agt.0192f4c8-2c5a-7b3e-9f1a-3c8d6e2b7a40]
    CommonConnectorIDValue:
      type: string
      format: connector-id
      description: Connector identifier. Accepts `con.<uuidv7>` or a bare UUIDv7 on input; always returned prefixed.
      pattern: ^(con\.)?[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      examples: [con.0192f4c8-7baf-7083-a46f-81d2bd70cf95]
    CommonContextIDValue:
      type: string
      format: context-id
      description: Context identifier. Accepts `ctx.<uuidv7>` or a bare UUIDv7 on input; always returned prefixed.
      pattern: ^(ctx\.)?[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      examples: [ctx.0192f4c8-3d6b-7c4f-a02b-4d9e7f3c8b51]
    CommonTaskIDValue:
      type: string
      format: task-id
      description: Task identifier. Accepts `task.<uuidv7>` or a bare UUIDv7 on input; always returned prefixed.
      pattern: ^(task\.)?[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      examples: [task.0192f4c8-4e7c-7d50-b13c-5eaf8a4d9c62]
    AgentsUserIDValue:
      type: string
      format: user-id
      description: Principal identifier. Accepts `usr.<uuidv7>` or a bare UUIDv7 on input; always returned prefixed.
      pattern: ^(usr\.)?[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      examples: [usr.0192f4c8-8bc0-7194-8570-92e3ce81d0a6]
    CommonMessageIDValue:
      type: string
      format: message-id
      description: Message identifier. Accepts `msg.<uuidv7>` or a bare UUIDv7 on input; always returned prefixed.
      pattern: ^(msg\.)?[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      examples: [msg.0192f4c8-5f8d-7e61-924d-6fb09b5ead73]
    CommonArtifactIDValue:
      type: string
      format: artifact-id
      description: Artifact identifier. Accepts `art.<uuidv7>` or a bare UUIDv7 on input; always returned prefixed.
      pattern: ^(art\.)?[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      examples: [art.0192f4c8-6a9e-7f72-a35e-70c1ac6fbe84]
    FeedbackIDValue:
      type: string
      format: feedback-id
      description: Feedback identifier. Accepts `fb.<uuidv7>` or a bare UUIDv7 on input; always returned prefixed.
      pattern: ^(fb\.)?[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      examples: [fb.0192f4c8-7e2a-7b3c-9d4e-5f6a7b8c9d01]
    AgentsVisibility:
      type: string
      description: "- `private` — creator / service principal only.

        - `unlisted` — usable by ID, hidden from list results.

        - `public` — listed tenant-wide.

        "
      enum: [private, unlisted, public]
      example: private
    AgentsLifecycle:
      type: string
      description: "- `ephemeral` — short-lived; expired automatically.

        - `persistent` — retained until explicitly deleted.

        "
      enum: [ephemeral, persistent]
      default: ephemeral
    AgentsLabels:
      type: object
      description: Free-form `string → string` metadata for filtering and organisation. Not used for routing or auth.
      additionalProperties: { type: string, maxLength: 256 }
      propertyNames: { type: string, pattern: "^[a-zA-Z0-9._/-]{1,128}$" }
      maxProperties: 64
      examples:
        - { team: coding, env: prod }
    AgentsResponse:
      type: object
      description: A configured agent — its metadata, model, and attached connectors.
      required:
        [
          id,
          name,
          visibility,
          lifecycle,
          connectors,
          createdAt,
          updatedAt,
          createdBy,
        ]
      properties:
        id: { $ref: "#/components/schemas/CommonAgentIDValue" }
        name:
          {
            type: string,
            minLength: 1,
            maxLength: 128,
            description: "Human-readable, unique-per-tenant agent name.",
          }
        description:
          type: [string, "null"]
          maxLength: 4096
          description: Free-form agent description shown to users and in tooling.
        systemPrompt:
          type: [string, "null"]
          description: System prompt prepended to every invocation.
        model:
          type: [string, "null"]
          description: "Model identifier. Tenant default if omitted or `null`.

            **Open question** — in the current implementation a model is
            configured per *expert*, not per *agent* (`Expert.modelName`), and an
            `Agent` has no model field at all. The desired end state is that
            there is **no distinction between an expert and an agent**, so `model`
            lives uniformly on this resource. Until that convergence lands, the
            precedence of an agent-level `model` over a connector/expert-level
          override is undecided and MUST be resolved before this field ships.
          "
          examples: [corti-default]
          x-open-question: expert-vs-agent-model-placement
        visibility: { $ref: "#/components/schemas/AgentsVisibility" }
        lifecycle: { $ref: "#/components/schemas/AgentsLifecycle" }
        connectors:
          type: array
          items: { $ref: "#/components/schemas/CommonConnectorResponse" }
          description: Connectors attached to the agent, discriminated by `type`.
        labels: { $ref: "#/components/schemas/AgentsLabels" }
        createdAt:
          {
            type: string,
            format: date-time,
            readOnly: true,
            description: When the agent was created.,
          }
        updatedAt:
          {
            type: string,
            format: date-time,
            readOnly: true,
            description: When the agent was last updated.,
          }
        createdBy:
          {
            $ref: "#/components/schemas/AgentsUserIDValue",
            readOnly: true,
            description: Principal (user or service principal) that created the agent.,
          }
      examples:
        - id: agt.0192f4c8-2c5a-7b3e-9f1a-3c8d6e2b7a40
          name: coder
          description: Returns ICD-10 codes for a clinical encounter.
          systemPrompt: Respond with only the ICD-10 code.
          model: corti-default
          visibility: private
          lifecycle: persistent
          connectors:
            - {
                id: con.0192f4c8-7baf-7083-a46f-81d2bd70cf95,
                type: registry,
                name: "@dedalus/coding-expert",
              }
          labels: { team: coding, env: prod }
          createdAt: "2026-05-19T12:00:00Z"
          updatedAt: "2026-05-19T12:00:00Z"
          createdBy: usr.0192f4c8-8bc0-7194-8570-92e3ce81d0a6
    AgentsCreateRequest:
      type: object
      description:
        "Request body for creating an agent. The server currently ignores
        `visibility` and `labels`; they are accepted but not persisted.
        "
      required: [name]
      properties:
        name:
          {
            type: string,
            minLength: 1,
            maxLength: 128,
            description: "Human-readable, unique-per-tenant agent name.",
            examples: [coder],
          }
        description:
          {
            type: string,
            maxLength: 4096,
            description: Free-form agent description.,
            examples: [Returns ICD-10 codes for a clinical encounter.],
          }
        systemPrompt:
          {
            type: string,
            description: System prompt prepended to every invocation.,
            examples: [Respond with only the ICD-10 code.],
          }
        model:
          {
            type: string,
            description: Tenant default if omitted.,
            examples: [corti-default],
          }
        visibility:
          { $ref: "#/components/schemas/AgentsVisibility", default: private }
        lifecycle:
          { $ref: "#/components/schemas/AgentsLifecycle", default: ephemeral }
        connectors:
          type: array
          items: { $ref: "#/components/schemas/CommonConnectorCreateRequest" }
          default: []
          description: Connectors to attach at creation. Defaults to an empty array.
        labels: { $ref: "#/components/schemas/AgentsLabels" }
      additionalProperties: false
    AgentsPatchRequest:
      type: object
      description:
        "JSON Merge Patch body. Omitted fields are unchanged; `null` clears;
        `connectors` is replaced wholesale.

        Note: the server currently honors only `name`, `description`,
        `systemPrompt`, `model`, and `connectors`. `visibility`, `lifecycle`,
        and `labels` are accepted but not yet persisted.
        "
      required: []
      properties:
        name:
          {
            type: string,
            minLength: 1,
            maxLength: 128,
            description: New agent name.,
            examples: [coder-v2],
          }
        description:
          type: [string, "null"]
          maxLength: 4096
          description: New description; `null` clears it.
          examples: [Returns SNOMED CT codes for a clinical encounter.]
        systemPrompt:
          type: [string, "null"]
          description: New system prompt; `null` clears it.
          examples: [Respond with only the SNOMED CT code.]
        model:
          type: [string, "null"]
          description: New model identifier; `null` falls back to the tenant default.
          examples: [corti-default]
        visibility: { $ref: "#/components/schemas/AgentsVisibility" }
        lifecycle: { $ref: "#/components/schemas/AgentsLifecycle" }
        connectors:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/CommonConnectorCreateRequest" }
          description: Replacement connector list; `null` clears connectors.
          examples: [[{ type: registry, name: "@dedalus/coding-expert" }]]
        labels:
          type: [object, "null"]
          additionalProperties:
            type: [string, "null"]
          description: Replacement labels; `null` clears labels.
          example: { team: coding, env: prod }
      additionalProperties: false
    AgentsListResponse:
      type: object
      description: A page of agents.
      required: [agents]
      properties:
        agents:
          type: array
          items: { $ref: "#/components/schemas/AgentsResponse" }
          description: Agents on the current page.
          examples:
            [
              [
                {
                  id: agt.0192f4c8-2c5a-7b3e-9f1a-3c8d6e2b7a40,
                  name: coder,
                  visibility: private,
                  lifecycle: persistent,
                  connectors: [],
                  createdAt: "2026-05-19T12:00:00Z",
                  updatedAt: "2026-05-19T12:00:00Z",
                  createdBy: usr.0192f4c8-8bc0-7194-8570-92e3ce81d0a6,
                },
              ],
            ]
        nextPageToken: { $ref: "#/components/schemas/CommonNextPageToken" }
        totalSize: { $ref: "#/components/schemas/CommonTotalSize" }
    CommonConnectorType:
      type: string
      description:
        "The connector discriminator. v2 ships `registry`, `mcp`, `agent`,

        `a2a`, and `schema`; `openapi` and `custom` are reserved for future

        minor versions.

        "
      enum: [registry, mcp, agent, a2a, schema]
    CommonConnectorBase:
      type: object
      description: Fields common to every connector kind.
      required: [id, type]
      properties:
        id:
          {
            $ref: "#/components/schemas/CommonConnectorIDValue",
            readOnly: true,
            description:
              "Server-generated connector identifier (prefixed UUIDv7). Stable across PATCH

              replacements where the underlying spec is unchanged. Used by

              observability/HITL to reference a connector unambiguously.

              ",
          }
        type: { $ref: "#/components/schemas/CommonConnectorType" }
        enabled:
          {
            type: boolean,
            default: true,
            description:
              "Whether the connector is active for invocations. Only `schema`
              connectors return this field today; `mcp`, `registry`, `agent`,
              and `a2a` connectors omit it (treat as enabled).
              ",
          }
    CommonRegistryConnectorProvisioned:
      description: A connector provisioned from a registry entry.
      allOf:
        - { $ref: "#/components/schemas/CommonConnectorBase" }
        - type: object
          required: [name]
          properties:
            type:
              {
                const: registry,
                description: Connector discriminator; always `registry`.,
              }
            name:
              type: string
              description: Registry connector name.
              examples: ["@dedalus/coding-expert"]
            config:
              {
                type: object,
                description: Connector-specific configuration validated against the registry schema.,
                additionalProperties: true,
              }
    CommonMcpConnector:
      description: A connector backed by a remote MCP server.
      allOf:
        - { $ref: "#/components/schemas/CommonConnectorBase" }
        - type: object
          required: [name, url]
          properties:
            type:
              {
                const: mcp,
                description: Connector discriminator; always `mcp`.,
              }
            name:
              { type: string, description: Display name for the MCP connector. }
            url:
              {
                type: string,
                format: uri,
                description: MCP server endpoint URL.,
              }
            auth: { $ref: "#/components/schemas/CommonConnectorAuth" }
    CommonAgentConnector:
      description: A connector that delegates to another agent.
      allOf:
        - { $ref: "#/components/schemas/CommonConnectorBase" }
        - type: object
          required: [agentId]
          properties:
            type:
              {
                const: agent,
                description: Connector discriminator; always `agent`.,
              }
            agentId: { $ref: "#/components/schemas/CommonAgentIDValue" }
    CommonA2AConnector:
      description: A connector that delegates to a remote A2A agent by endpoint URL.
      allOf:
        - { $ref: "#/components/schemas/CommonConnectorBase" }
        - type: object
          required: [url]
          properties:
            type:
              {
                const: a2a,
                description: Connector discriminator; always `a2a`.,
              }
            name:
              {
                type: string,
                description: Optional display name for the remote A2A agent.,
              }
            url:
              type: string
              format: uri
              description: The remote agent's A2A endpoint (typically a `.well-known/agent-card.json`).
              examples:
                [
                  "https://marginalia.polycode.co.uk/.well-known/agent-card.json",
                ]
    CommonSchemaConnector:
      description: A connector backed by a schema definition.
      allOf:
        - { $ref: "#/components/schemas/CommonConnectorBase" }
        - type: object
          required: [name, schema]
          properties:
            type:
              {
                const: schema,
                description: Connector discriminator; always `schema`.,
              }
            name:
              {
                type: string,
                description: Schema connector name. Used as the tool name the LLM calls.,
              }
            description:
              {
                type: string,
                description: What the tool does. Read by the LLM to decide when to call it.,
              }
            schema:
              {
                type: object,
                description: JSON Schema defining the tool's output shape.,
                additionalProperties: true,
              }
            transition:
              type: string
              enum: [complete, input_required]
              description: If set, calling this tool terminates the loop in the given state after validating and storing the data part. No further LLM call.
    CommonConnectorResponse:
      description: A connector attached to an agent, discriminated by `type`.
      oneOf:
        - { $ref: "#/components/schemas/CommonRegistryConnectorProvisioned" }
        - { $ref: "#/components/schemas/CommonMcpConnector" }
        - { $ref: "#/components/schemas/CommonAgentConnector" }
        - { $ref: "#/components/schemas/CommonA2AConnector" }
        - { $ref: "#/components/schemas/CommonSchemaConnector" }
      discriminator:
        propertyName: type
        mapping:
          {
            registry: "#/components/schemas/CommonRegistryConnectorProvisioned",
            mcp: "#/components/schemas/CommonMcpConnector",
            agent: "#/components/schemas/CommonAgentConnector",
            a2a: "#/components/schemas/CommonA2AConnector",
            schema: "#/components/schemas/CommonSchemaConnector",
          }
    CommonConnectorCreateRequest:
      description: Same envelope as `Connector` but without the server-generated `id`.
      oneOf:
        - { $ref: "#/components/schemas/CommonRegistryConnectorCreate" }
        - { $ref: "#/components/schemas/CommonMcpConnectorCreate" }
        - { $ref: "#/components/schemas/CommonAgentConnectorCreate" }
        - { $ref: "#/components/schemas/CommonA2AConnectorCreate" }
        - { $ref: "#/components/schemas/CommonSchemaConnectorCreate" }
      discriminator:
        propertyName: type
        mapping:
          {
            registry: "#/components/schemas/CommonRegistryConnectorCreate",
            mcp: "#/components/schemas/CommonMcpConnectorCreate",
            agent: "#/components/schemas/CommonAgentConnectorCreate",
            a2a: "#/components/schemas/CommonA2AConnectorCreate",
            schema: "#/components/schemas/CommonSchemaConnectorCreate",
          }
    CommonRegistryConnectorCreate:
      type: object
      description: Request body for attaching a registry connector.
      required: [type, name]
      properties:
        type:
          {
            const: registry,
            description: Connector discriminator; always `registry`.,
          }
        name:
          type: string
          description: Registry connector name.
          examples: ["@dedalus/coding-expert"]
        enabled:
          {
            type: boolean,
            default: true,
            description: Whether the connector is active for invocations.,
          }
        config:
          {
            type: object,
            additionalProperties: true,
            description: "Connector-specific configuration validated against the
              registry schema. Not yet persisted — the server currently drops
              `config` for registry connectors on create.
              ",
          }
      additionalProperties: false
    CommonMcpConnectorCreate:
      type: object
      description: Request body for attaching an MCP connector.
      required: [type, name, url]
      properties:
        type:
          { const: mcp, description: Connector discriminator; always `mcp`. }
        name: { type: string, description: Display name for the MCP connector. }
        url:
          { type: string, format: uri, description: MCP server endpoint URL. }
        enabled:
          {
            type: boolean,
            default: true,
            description: Whether the connector is active for invocations.,
          }
        auth: { $ref: "#/components/schemas/CommonConnectorAuth" }
      additionalProperties: false
    CommonAgentConnectorCreate:
      type: object
      description: Request body for attaching an agent connector.
      required: [type, agentId]
      properties:
        type:
          {
            const: agent,
            description: Connector discriminator; always `agent`.,
          }
        agentId: { $ref: "#/components/schemas/CommonAgentIDValue" }
        enabled:
          {
            type: boolean,
            default: true,
            description: Whether the connector is active for invocations.,
          }
      additionalProperties: false
    CommonA2AConnectorCreate:
      type: object
      description: Request body for attaching a remote A2A agent connector.
      required: [type, url]
      properties:
        type:
          { const: a2a, description: Connector discriminator; always `a2a`. }
        name:
          {
            type: string,
            description: Optional display name for the remote A2A agent.,
          }
        url:
          {
            type: string,
            format: uri,
            description: Remote agent A2A endpoint URL.,
          }
        enabled:
          {
            type: boolean,
            default: true,
            description: Whether the connector is active for invocations.,
          }
      additionalProperties: false
    CommonSchemaConnectorCreate:
      type: object
      description: Request body for attaching a schema connector.
      required: [type, name, schema]
      properties:
        type:
          {
            const: schema,
            description: Connector discriminator; always `schema`.,
          }
        name: { type: string, description: Schema connector name. }
        description:
          {
            type: string,
            description: What the tool does. Read by the LLM to decide when to call it.,
          }
        schema:
          {
            type: object,
            description: JSON Schema defining the tool's output shape.,
            additionalProperties: true,
          }
        transition:
          type: string
          enum: [complete, input_required]
          description: If set, calling this tool terminates the loop in the given state.
        enabled:
          {
            type: boolean,
            default: true,
            description: Whether the connector is active for invocations.,
          }
      additionalProperties: false
    ConnectorsPatchRequest:
      type: object
      description: Merge-patch of a single connector. `type` is immutable.
      required: []
      properties:
        enabled:
          {
            type: boolean,
            description: Whether the connector is active.,
            examples: [false],
          }
        name:
          {
            type: string,
            description: New connector name.,
            examples: [policybot-v2],
          }
        url:
          type: [string, "null"]
          format: uri
          description: New connector URL; `null` clears it.
          examples: ["https://mcp.example.com/v2"]
        config:
          type: [object, "null"]
          additionalProperties: true
          description: New connector config; `null` clears it.
          example: { timeout: 30 }
        auth:
          oneOf:
            - { $ref: "#/components/schemas/CommonConnectorAuth" }
            - { type: "null" }
          example: { type: bearer }
      additionalProperties: false
    CommonConnectorAuth:
      type: object
      description: Authentication configuration for an outbound connector.
      required: [type]
      properties:
        type:
          type: string
          enum: [none, bearer, apiKey, oauth2]
          description: Authentication mechanism.
        scope: { type: string, description: OAuth2 scope requested. }
        redirectUrl:
          { type: string, format: uri, description: OAuth2 redirect URL. }
        ref:
          {
            type: string,
            description: Reference to a server-side stored secret. Mutually exclusive with inline credentials passed at call time.,
          }
      additionalProperties: false
      examples:
        - {
            type: oauth2,
            scope: "read:policies",
            redirectUrl: "https://app.corti.ai/oauth/callback",
          }
    ConnectorsListResponse:
      type: object
      description: An agent's attached connectors.
      required: [connectors]
      properties:
        connectors:
          type: array
          items: { $ref: "#/components/schemas/CommonConnectorResponse" }
          description: Connectors attached to the agent.
          examples:
            [
              [
                {
                  id: con.0192f4c8-7baf-7083-a46f-81d2bd70cf95,
                  type: registry,
                  name: "@dedalus/coding-expert",
                  enabled: true,
                },
              ],
            ]
    RegistryConnectorResponse:
      type: object
      description:
        "A discoverable, pre-built connector offered by the platform registry.

        Only `id`, `type`, `name`, `title`, `description`, and `configSchema`
        are populated by the server today. `version`, `provider`,
        `capabilities`, `tags`, and `documentationUrl` are declared for forward
        compatibility but are not yet returned.
        "
      required: [id, type, name]
      properties:
        id:
          type: string
          description: Stable, namespaced registry identifier; use as a `registry` connector's `name`.
          examples: ["@dedalus/coding-expert"]
        type:
          {
            $ref: "#/components/schemas/CommonConnectorType",
            description: The connector kind this entry provisions when attached to an agent.,
          }
        name:
          type: string
          description: Programmatic name (MCP convention).
          examples: [coding-expert]
        title:
          type: string
          description: Human-readable display name (MCP convention).
          examples: [ICD-10 Coding Expert]
        description:
          {
            type: string,
            description: Description for list and detail views. May contain CommonMark.,
          }
        version:
          type: string
          description: Latest published version (SemVer recommended).
          examples: [1.4.2]
        icons:
          type: array
          description: Display icons (MCP convention).
          items: { $ref: "#/components/schemas/RegistryIcon" }
        provider:
          type: string
          description: Name of the publishing organisation.
          examples: [Dedalus]
        websiteUrl:
          {
            type: string,
            format: uri,
            description: Connector homepage (MCP convention).,
          }
        documentationUrl:
          {
            type: string,
            format: uri,
            description: Documentation URL for the connector.,
          }
        capabilities:
          { $ref: "#/components/schemas/RegistryConnectorCapabilities" }
        tags:
          type: array
          description: Keywords for search and filtering.
          items: { type: string }
        configSchema:
          {
            type: object,
            description: JSON Schema (draft 2020-12) describing the connector's accepted `config`.,
            additionalProperties: true,
          }
      examples:
        - id: "@dedalus/coding-expert"
          type: registry
          name: coding-expert
          title: ICD-10 Coding Expert
          description: Returns ICD-10 codes for a clinical encounter.
          version: 1.4.2
          icons:
            - src: https://cdn.corti.ai/registry/dedalus/coding-expert.svg
              mimeType: image/svg+xml
              sizes: [any]
          provider: Dedalus
          websiteUrl: https://dedalus.example.com/coding-expert
          documentationUrl: https://docs.dedalus.example.com/coding-expert
          capabilities:
            streaming: true
            inputModes: [text/plain]
            outputModes: [text/plain, application/json]
            tools: [lookup_icd10, validate_code]
          tags: [icd10, billing, expert]
    RegistryIcon:
      type: object
      description: An icon resource, following the MCP `Icon` shape.
      required: [src]
      properties:
        src: { type: string, format: uri, description: Icon source URL. }
        mimeType:
          type: string
          examples: [image/svg+xml, image/png]
          description: MIME type of the icon resource.
        sizes:
          type: array
          description: "`WxH` size hints (e.g. `48x48`), or `any` for scalable icons."
          items: { type: string }
          examples:
            - [48x48]
            - [any]
    RegistryConnectorCapabilities:
      type: object
      description: What the connector can do once attached.
      required: []
      properties:
        streaming:
          {
            type: boolean,
            description: Emits incremental updates during a task.,
          }
        inputModes:
          type: array
          description: Accepted input media types.
          items: { type: string }
        outputModes:
          type: array
          description: Produced output media types.
          items: { type: string }
        tools:
          type: array
          description: Names of tools the connector exposes to the agent.
          items: { type: string }
    RegistryConnectorListResponse:
      type: object
      description: A page of registry connectors.
      required: [connectors]
      properties:
        connectors:
          type: array
          items: { $ref: "#/components/schemas/RegistryConnectorResponse" }
          description: Registry connectors on the current page.
          examples:
            [
              [
                {
                  id: "@dedalus/coding-expert",
                  type: registry,
                  name: coding-expert,
                },
              ],
            ]
        nextPageToken: { $ref: "#/components/schemas/CommonNextPageToken" }
        totalSize: { $ref: "#/components/schemas/CommonTotalSize" }
    UsageGranularity:
      type: string
      description:
        "The size of each usage reporting bucket. Only `day` is currently
        honored; `minute`, `hour`, and `week` are accepted but produce daily
        buckets (the server always returns `day`).
        "
      enum: [minute, hour, day, week]
      default: day
    UsageMetrics:
      type: object
      description: Invocation metrics for a single period.
      required: [invocations, uniqueContexts]
      properties:
        invocations:
          type: integer
          format: int64
          minimum: 0
          description: Number of agent invocations in the period.
          examples: [12]
        uniqueContexts:
          type: integer
          format: int64
          minimum: 0
          description: Number of distinct contexts invoked in the period.
          examples: [5]
    UsageBucket:
      description: Usage metrics for a single time bucket.
      allOf:
        - type: object
          required: [periodStart, periodEnd]
          properties:
            periodStart:
              type: string
              format: date-time
              description: Inclusive start of the bucket (UTC).
              examples: ["2026-05-19T00:00:00Z"]
            periodEnd:
              type: string
              format: date-time
              description: Exclusive end of the bucket (UTC).
              examples: ["2026-05-20T00:00:00Z"]
        - { $ref: "#/components/schemas/UsageMetrics" }
    UsageReportResponse:
      type: object
      description: An agent's bucketed usage over a date range, with range-wide totals.
      required: [granularity, from, to, totals, buckets]
      properties:
        granularity: { $ref: "#/components/schemas/UsageGranularity" }
        from:
          type: string
          format: date-time
          description: Resolved inclusive start of the range (UTC).
          examples: ["2026-05-19T00:00:00Z"]
        to:
          type: string
          format: date-time
          description: Resolved exclusive end of the range (UTC).
          examples: ["2026-05-21T00:00:00Z"]
        totals:
          {
            $ref: "#/components/schemas/UsageMetrics",
            description: Aggregate metrics across the whole range.,
          }
        buckets:
          type: array
          description: One entry per period with activity, ordered oldest first.
          items: { $ref: "#/components/schemas/UsageBucket" }
      examples:
        - granularity: day
          from: "2026-05-19T00:00:00Z"
          to: "2026-05-21T00:00:00Z"
          totals: { invocations: 15, uniqueContexts: 6 }
          buckets:
            - {
                periodStart: "2026-05-19T00:00:00Z",
                periodEnd: "2026-05-20T00:00:00Z",
                invocations: 12,
                uniqueContexts: 5,
              }
            - {
                periodStart: "2026-05-20T00:00:00Z",
                periodEnd: "2026-05-21T00:00:00Z",
                invocations: 3,
                uniqueContexts: 2,
              }
    Contexts:
      type: object
      description:
        "Lightweight context metadata, as returned in list responses. Contexts
        are not first-class CRUD resources: there is no explicit create or
        update endpoint — a context is created implicitly on the first
        message send (or reused by client-supplied contextId), and list is
        not yet implemented.
        "
      required: [id]
      properties:
        id: { $ref: "#/components/schemas/CommonContextIDValue" }
        agentId: { $ref: "#/components/schemas/CommonAgentIDValue" }
        taskCount:
          {
            type: integer,
            minimum: 0,
            readOnly: true,
            description: Total number of tasks in the context.,
          }
        createdAt:
          {
            type: string,
            format: date-time,
            description: When the context was created.,
          }
        updatedAt:
          {
            type: string,
            format: date-time,
            description: When the context was last updated.,
          }
        expiresAt:
          type: [string, "null"]
          format: date-time
          description:
            "When the context expires; `null` means it does not expire. Not
            yet implemented — the server always returns `null` and performs no
            TTL-based cleanup.
            "
    ContextsDetailResponse:
      description:
        "A context together with its tasks. Returned by `GET /contexts/{id}`.

        Tasks are ordered oldest first and each carries its full message

        `history` — the user's prompt for a task is the `ROLE_USER` message

        within that task's history.

        "
      allOf:
        - { $ref: "#/components/schemas/Contexts" }
        - type: object
          required: [tasks]
          properties:
            tasks:
              type: array
              description: The context's tasks, oldest first, each with full message history.
              items: { $ref: "#/components/schemas/CommonTaskResponse" }
      examples:
        - id: ctx.0192f4c8-3d6b-7c4f-a02b-4d9e7f3c8b51
          agentId: agt.0192f4c8-2c5a-7b3e-9f1a-3c8d6e2b7a40
          taskCount: 1
          createdAt: "2026-05-19T12:00:00Z"
          updatedAt: "2026-05-19T12:00:01Z"
          expiresAt: null
          tasks:
            - id: task.0192f4c8-4e7c-7d50-b13c-5eaf8a4d9c62
              contextId: ctx.0192f4c8-3d6b-7c4f-a02b-4d9e7f3c8b51
              status:
                {
                  state: TASK_STATE_COMPLETED,
                  timestamp: "2026-05-19T12:00:01Z",
                }
              history:
                - role: ROLE_USER
                  messageId: msg.0192f4c8-5a01-7c10-8a2b-1f3c5d7e9b00
                  parts:
                    - {
                        text: "Code this encounter: acute asthma exacerbation.",
                      }
                - role: ROLE_AGENT
                  messageId: msg.0192f4c8-5f8d-7e61-924d-6fb09b5ead73
                  taskId: task.0192f4c8-4e7c-7d50-b13c-5eaf8a4d9c62
                  parts:
                    - { text: J45.901 }
              artifacts:
                - artifactId: art.0192f4c8-6a9e-7f72-a35e-70c1ac6fbe84
                  parts:
                    - { text: J45.901 }
    ContextsListResponse:
      type: object
      description: A page of contexts.
      required: [contexts]
      properties:
        contexts:
          type: array
          items: { $ref: "#/components/schemas/Contexts" }
          description: Contexts on the current page.
          examples: [[{ id: ctx.0192f4c8-3d6b-7c4f-a02b-4d9e7f3c8b51 }]]
        nextPageToken: { $ref: "#/components/schemas/CommonNextPageToken" }
        totalSize: { $ref: "#/components/schemas/CommonTotalSize" }
    ContextsTraceResponse:
      type: object
      description:
        "A page of traces for a context in OpenInference format. Traces are

        ordered newest-first.

        "
      required: [traces]
      properties:
        traces:
          type: array
          items: { $ref: "#/components/schemas/ContextsTraceItem" }
          description: Traces for the context, newest first.
          examples:
            [
              [
                {
                  trace:
                    {
                      id: "0192f4c85f3a7e8ab1c23d4e5f6a7b8c",
                      name: invoke_agent,
                      start_time: "2026-05-19T12:00:00Z",
                      thread_id: ctx.0192f4c8-3d6b-7c4f-a02b-4d9e7f3c8b51,
                    },
                  spans:
                    [
                      {
                        name: invoke_llm,
                        span_id: span.0192f4c8-6e1a-7f2b-9c3d-4e5f6a7b8c9d,
                        start_time: "2026-05-19T12:00:00Z",
                      },
                    ],
                },
              ],
            ]
        nextPageToken: { $ref: "#/components/schemas/CommonNextPageToken" }
        totalSize: { $ref: "#/components/schemas/CommonTotalSize" }
    ContextsTraceItem:
      type: object
      description: "A single trace with its inlined OpenInference spans.

        "
      required: [trace, spans]
      properties:
        trace:
          type: object
          description: The trace-level record.
          required: [id, name, start_time, thread_id]
          properties:
            id:
              {
                type: string,
                description: Trace identifier (OTel trace ID — 32-char hex).,
              }
            name: { type: string, description: Human-readable trace name. }
            start_time:
              {
                type: string,
                format: date-time,
                description: When the trace started.,
              }
            end_time:
              type: [string, "null"]
              format: date-time
              description: When the trace ended; `null` if still in progress.
            input:
              {
                type: object,
                additionalProperties: true,
                description: Trace-level input payload.,
              }
            output:
              {
                type: object,
                additionalProperties: true,
                description: Trace-level output payload.,
              }
            metadata:
              {
                type: object,
                additionalProperties: true,
                description: Free-form trace metadata.,
              }
            tags:
              type: array
              items: { type: string }
              description: Trace tags.
            thread_id: { type: string, description: Thread/context identifier. }
        spans:
          type: array
          description: Spans in this trace, ordered by start time.
          items: { $ref: "#/components/schemas/ContextsOpenInferenceSpan" }
    ContextsOpenInferenceSpan:
      type: object
      description: A single span in an OpenInference trace.
      required: [name, span_id, start_time]
      properties:
        name: { type: string, description: Human-readable span name. }
        span_id: { type: string, description: Unique span identifier. }
        parent_span_id:
          {
            type: string,
            description: "Parent span id, omitted for the root span.",
          }
        start_time:
          {
            type: string,
            format: date-time,
            description: When the span started.,
          }
        end_time:
          type: [string, "null"]
          format: date-time
          description: When the span ended; `null` if still in progress.
        attributes:
          type: object
          additionalProperties: true
          description: OpenInference span attributes. Key names and structure follow the OpenInference semantic conventions.
          examples:
            [
              { llm.token_count.total: 42 },
              { tool.name: icd10-lookup },
              { input.value: "chief complaint: chest pain" },
            ]
    CommonRole:
      type: string
      description: The author of a message.
      enum: [ROLE_USER, ROLE_AGENT]
    CommonPart:
      type: object
      description: A single content part of a message or artifact.
      required: []
      properties:
        text:
          {
            type: string,
            description: "The string content of the `text` part.",
          }
        data:
          {
            type: object,
            additionalProperties: true,
            description: "Arbitrary structured `data` as a JSON value (object, array, string, number, boolean, or null).",
          }
        filename:
          {
            type: string,
            description: "An optional `filename` for the file (e.g., `document.pdf`).",
          }
        mediaType:
          {
            type: string,
            description: "The `media_type` (MIME type) of the part content (e.g., `text/plain`, `application/json`, `image/png`).",
          }
        raw:
          {
            type: string,
            contentEncoding: base64,
            pattern: "^[A-Za-z0-9+/]*={0,2}$",
            description: "The `raw` byte content of a file. Encoded as a base64 string.",
          }
        url:
          {
            type: string,
            description: "A `url` pointing to the file's content.",
          }
        metadata:
          {
            type: object,
            additionalProperties: true,
            description: "Optional metadata associated with this part.",
          }
      additionalProperties: true
    CommonMessage:
      type: object
      description: An A2A message — an ordered list of content parts with a role.
      required: [role, parts]
      properties:
        messageId: { $ref: "#/components/schemas/CommonMessageIDValue" }
        contextId: { $ref: "#/components/schemas/CommonContextIDValue" }
        taskId: { $ref: "#/components/schemas/CommonTaskIDValue" }
        role: { $ref: "#/components/schemas/CommonRole" }
        parts:
          type: array
          items: { $ref: "#/components/schemas/CommonPart" }
          description: Ordered content parts of the message.
        referenceTaskIds:
          type: array
          description: Task ids this message references (A2A v1.0 `Message.referenceTaskIds`).
          items: { $ref: "#/components/schemas/CommonTaskIDValue" }
        extensions:
          type: array
          description: URIs of A2A extensions that contributed to this message (A2A v1.0 `Message.extensions`).
          items: { type: string, format: uri }
        metadata:
          type: object
          additionalProperties: true
          description:
            "Free-form A2A metadata. Corti's own first-party keys are prefixed

            with `$` (à la Mixpanel) to set them apart from caller-supplied keys.

            A2A defines no message-level timestamp, so Corti carries one as

            `$timestamp` (RFC 3339 / ISO 8601) — useful for timing *user*

            messages, which `TaskStatus.timestamp` cannot.

            "
          examples:
            - { $timestamp: "2026-05-19T12:00:00Z" }
    CommonArtifactResponse:
      type: object
      description: A named output produced by a task.
      required: [artifactId, parts]
      properties:
        artifactId: { $ref: "#/components/schemas/CommonArtifactIDValue" }
        name:
          {
            type: string,
            description: Optional artifact name.,
            examples: [icd10-result],
          }
        description:
          {
            type: string,
            description: A human-readable description of the artifact.,
          }
        extensions:
          type: array
          description: URIs of extensions that contributed to this artifact.
          items: { type: string, format: uri }
        metadata:
          {
            type: object,
            additionalProperties: true,
            description: Optional metadata included with the artifact.,
          }
        parts:
          type: array
          items: { $ref: "#/components/schemas/CommonPart" }
          description: Content parts of the artifact.
          examples: [[{ text: J45.909 }]]
    CommonTaskState:
      type: string
      description: The lifecycle state of a task.
      enum:
        [
          TASK_STATE_SUBMITTED,
          TASK_STATE_WORKING,
          TASK_STATE_COMPLETED,
          TASK_STATE_FAILED,
          TASK_STATE_CANCELED,
          TASK_STATE_INPUT_REQUIRED,
          TASK_STATE_REJECTED,
          TASK_STATE_AUTH_REQUIRED,
        ]
    CommonTaskStatus:
      type: object
      description: A task's current state, with an optional status message and timestamp.
      required: [state]
      properties:
        state: { $ref: "#/components/schemas/CommonTaskState" }
        message: { $ref: "#/components/schemas/CommonMessage" }
        timestamp:
          {
            type: string,
            format: date-time,
            description: When the status was last updated.,
          }
    CommonTaskResponse:
      type: object
      description: An A2A task — a unit of agent work with status, history, and artifacts.
      required: [id, contextId, status]
      properties:
        id: { $ref: "#/components/schemas/CommonTaskIDValue" }
        contextId: { $ref: "#/components/schemas/CommonContextIDValue" }
        status:
          {
            $ref: "#/components/schemas/CommonTaskStatus",
            examples:
              [
                {
                  state: TASK_STATE_COMPLETED,
                  timestamp: "2026-05-19T12:00:00Z",
                },
              ],
          }
        history:
          type: array
          items: { $ref: "#/components/schemas/CommonMessage" }
          description: Messages exchanged during the task, oldest first.
          examples:
            [
              [
                {
                  messageId: msg.0192f4c8-5f8d-7e61-924d-6fb09b5ead73,
                  role: ROLE_AGENT,
                  parts: [{ text: J45.909 }],
                },
              ],
            ]
        artifacts:
          type: array
          items: { $ref: "#/components/schemas/CommonArtifactResponse" }
          description: Artifacts produced by the task.
          examples:
            [
              [
                {
                  artifactId: art.0192f4c8-6a9e-7f72-a35e-70c1ac6fbe84,
                  name: icd10-result,
                  parts: [{ text: J45.909 }],
                },
              ],
            ]
        metadata:
          {
            $ref: "#/components/schemas/CommonTaskMetadata",
            description:
              "Task metadata, including `$usage` token/credit accounting.
              Not yet exposed through the REST binding (deferred); only the
              JSON-RPC binding populates this field.
              ",
            example:
              {
                $usage:
                  {
                    model: corti-default,
                    inputTokens: 100,
                    outputTokens: 20,
                    totalTokens: 120,
                    credits: 1.2,
                  },
              },
          }
    CommonTaskListResponse:
      type: object
      description: A page of tasks.
      required: [tasks]
      properties:
        pageSize:
          {
            type: integer,
            minimum: 1,
            description: The page size used for this response.,
          }
        tasks:
          type: array
          items: { $ref: "#/components/schemas/CommonTaskResponse" }
          description: Tasks on the current page.
          examples:
            [
              [
                {
                  id: task.0192f4c8-4e7c-7d50-b13c-5eaf8a4d9c62,
                  contextId: ctx.0192f4c8-3d6b-7c4f-a02b-4d9e7f3c8b51,
                  status: { state: TASK_STATE_COMPLETED },
                },
              ],
            ]
        nextPageToken: { $ref: "#/components/schemas/CommonNextPageToken" }
        totalSize: { $ref: "#/components/schemas/CommonTotalSize" }
    A2ASendMessageConfiguration:
      type: object
      description: Per-request options controlling how a message is processed.
      required: []
      properties:
        returnImmediately:
          {
            type: boolean,
            default: false,
            description: "If `true`, return as soon as the task is submitted, even if processing is still in progress. If `false` (default), wait until the task reaches a terminal (`COMPLETED`, `FAILED`, `CANCELED`, `REJECTED`) or interrupted (`INPUT_REQUIRED`, `AUTH_REQUIRED`) state.",
          }
        historyLength:
          {
            type: integer,
            minimum: 0,
            description: Maximum number of prior messages to include as context.,
          }
        acceptedOutputModes:
          type: array
          items: { type: string }
          description: Output media types the caller accepts.
    A2ASendMessageRequest:
      type: object
      description: Request body for sending a message to an agent.
      required: [message]
      properties:
        message: { $ref: "#/components/schemas/CommonMessage" }
        configuration:
          { $ref: "#/components/schemas/A2ASendMessageConfiguration" }
        metadata:
          {
            type: object,
            additionalProperties: true,
            description: Free-form request metadata.,
            examples: [{ requestSource: mobile, traceId: trace.abc123 }],
          }
        tenant:
          {
            type: string,
            description: "Optional. Opaque routing identifier. Must match the `tenant` value from the selected `AgentInterface` in the Agent Card when that field is set.",
          }
    A2ASendMessageResponse:
      type: object
      description: Exactly one of `task` or `message` is present.
      required: []
      properties:
        task: { $ref: "#/components/schemas/CommonTaskResponse" }
        message: { $ref: "#/components/schemas/CommonMessage" }
      oneOf:
        - required: [task]
        - required: [message]
    A2AStreamResponse:
      type: object
      description: A single A2A streaming event. Exactly one field is present.
      required: []
      properties:
        task: { $ref: "#/components/schemas/CommonTaskResponse" }
        message: { $ref: "#/components/schemas/CommonMessage" }
        statusUpdate:
          type: object
          properties:
            taskId: { $ref: "#/components/schemas/CommonTaskIDValue" }
            contextId: { $ref: "#/components/schemas/CommonContextIDValue" }
            status: { $ref: "#/components/schemas/CommonTaskStatus" }
            metadata:
              {
                type: object,
                additionalProperties: true,
                description: Free-form metadata for this update.,
              }
          description: "Incremental task status update. There is no `final` flag; clients infer finality from the task state (TASK_STATE_COMPLETED, TASK_STATE_FAILED, TASK_STATE_CANCELED, TASK_STATE_REJECTED are terminal)."
        artifactUpdate:
          type: object
          properties:
            taskId: { $ref: "#/components/schemas/CommonTaskIDValue" }
            artifact: { $ref: "#/components/schemas/CommonArtifactResponse" }
            lastChunk:
              {
                type: boolean,
                description: Whether this is the last chunk of the artifact.,
              }
          description: Incremental artifact update.
      oneOf:
        - required: [task]
        - required: [message]
        - required: [statusUpdate]
        - required: [artifactUpdate]
    A2ASSEEvent:
      type: object
      description: "A single Server-Sent Event frame (W3C SSE wire format). The server currently writes only `id` and `data` lines; `event` and `retry` are declared for forward compatibility but not sent."
      required: [data]
      properties:
        data:
          {
            type: string,
            contentMediaType: application/json,
            description: SSE payload (JSON-encoded).,
          }
        event:
          {
            type: string,
            description: Event type. Absent for the default `message` event.,
          }
        id:
          {
            type: string,
            description:
              "Opaque event id. Clients echo the most recent value in the

              `Last-Event-ID` header to resume a dropped stream.

              ",
          }
        retry:
          {
            type: integer,
            minimum: 0,
            description: Reconnection time in milliseconds the client should use.,
          }
    A2AJSONRPCStreamEventResponse:
      description: An SSE event carrying a JSON-RPC streaming response.
      allOf:
        - { $ref: "#/components/schemas/A2ASSEEvent" }
        - type: object
          properties:
            data:
              type: string
              contentMediaType: application/json
              contentSchema: { $ref: "#/components/schemas/A2AJSONRPCResponse" }
              description: "SSE payload: a JSON-RPC streaming response."
    A2AStreamEventResponse:
      description: An SSE event carrying an A2A `HTTP+JSON` streaming response.
      allOf:
        - { $ref: "#/components/schemas/A2ASSEEvent" }
        - type: object
          properties:
            data:
              type: string
              contentMediaType: application/json
              contentSchema: { $ref: "#/components/schemas/A2AStreamResponse" }
              description: "SSE payload: an A2A HTTP+JSON streaming response."
    AgentCardResponse:
      type: object
      description: An A2A agent card describing capabilities, skills, and supported interfaces.
      required: [name, version, capabilities, supportedInterfaces]
      properties:
        name:
          {
            type: string,
            description: Agent display name.,
            examples: [Corti Coding Agent],
          }
        description:
          {
            type: string,
            description: Agent description.,
            examples: [Returns ICD-10 codes for a clinical encounter.],
          }
        documentationUrl:
          {
            type: string,
            format: uri,
            description: A URL providing additional documentation about the agent.,
          }
        iconUrl:
          {
            type: string,
            format: uri,
            description: Optional URL to an icon for the agent.,
          }
        version:
          {
            type: string,
            description: Agent card version (SemVer).,
            examples: [2.0.0],
          }
        capabilities:
          type: object
          properties:
            streaming:
              {
                type: boolean,
                description: Whether the agent supports streaming responses.,
              }
            pushNotifications:
              {
                type: boolean,
                description:
                  "Whether the agent can push task updates to a client-supplied webhook.

                  **Future scope**: the `tasks/pushNotificationConfig/*` management endpoints are not yet implemented.
                  Expect this to be `false` until they ship.
                  ",
              }
          description: Agent capability flags (streaming, push notifications).
          example: { streaming: true, pushNotifications: false }
        defaultInputModes:
          type: array
          items: { type: string }
          description: Default input media types.
          examples: [[text/plain]]
        defaultOutputModes:
          type: array
          items: { type: string }
          description: Default output media types.
          examples: [[text/plain]]
        provider:
          type: object
          properties:
            organization:
              { type: string, description: Publishing organization name. }
            url:
              {
                type: string,
                format: uri,
                description: Publishing organization URL.,
              }
          description: Publishing organization and URL.
          example: { organization: Corti, url: "https://corti.ai" }
        securityRequirements:
          type: array
          description: Security requirements for contacting the agent.
          items:
            {
              type: object,
              additionalProperties: true,
              description: A map of security schemes to the required scopes.,
            }
        securitySchemes:
          type: object
          description: The security scheme details used for authenticating with this agent.
          additionalProperties: true
        signatures:
          type: array
          description: "JSON Web Signatures (JWS, RFC 7515) computed for this agent card."
          items:
            type: object
            required: [protected, signature]
            properties:
              protected:
                {
                  type: string,
                  description: Base64url-encoded protected JWS header.,
                }
              header:
                {
                  type: object,
                  additionalProperties: true,
                  description: Unprotected JWS header values.,
                }
              signature:
                { type: string, description: Base64url-encoded signature. }
        skills:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string, description: Skill identifier. }
              name: { type: string, description: Skill display name. }
              description: { type: string, description: Skill description. }
              tags:
                type: array
                items: { type: string }
                description: Keywords for search and filtering.
          description: Skills the agent exposes.
          examples:
            [
              [
                {
                  id: con.0192f4c8-7baf-7083-a46f-81d2bd70cf95,
                  name: coding-expert,
                  description: ICD-10 coding.,
                  tags: [expert],
                },
              ],
            ]
        supportedInterfaces:
          type: array
          description: A2A protocol bindings. v2 advertises protocolVersion `1.0` only.
          items:
            type: object
            required: [protocolBinding, protocolVersion, url]
            properties:
              protocolBinding:
                type: string
                enum: [JSONRPC, HTTP+JSON]
                description: A2A protocol binding type.
              protocolVersion:
                {
                  type: string,
                  const: "1.0",
                  description: A2A protocol version; always `1.0`.,
                }
              url:
                {
                  type: string,
                  format: uri,
                  description: Endpoint URL for this protocol binding.,
                }
          examples:
            [
              [
                {
                  protocolBinding: JSONRPC,
                  protocolVersion: "1.0",
                  url: "https://api.eu.corti.app/v2/agentic/agents/agt.0192f4c8-2c5a-7b3e-9f1a-3c8d6e2b7a40/a2a",
                },
              ],
            ]
    A2AJSONRPCRequest:
      type: object
      description: A JSON-RPC 2.0 request envelope.
      required: [jsonrpc, method, id]
      properties:
        jsonrpc:
          {
            const: "2.0",
            description: JSON-RPC protocol version; always `2.0`.,
          }
        id:
          oneOf:
            - { type: string }
            - { type: integer }
          examples: [msg-001, 42]
        method:
          type: string
          enum:
            [
              SendMessage,
              SendStreamingMessage,
              GetTask,
              ListTasks,
              CancelTask,
              SubscribeToTask,
            ]
          description: JSON-RPC method name (PascalCase on the wire).
          examples: [SendMessage]
        params:
          {
            type: object,
            additionalProperties: true,
            description: JSON-RPC params object.,
            example:
              {
                message:
                  {
                    role: ROLE_USER,
                    parts: [{ text: "What is the ICD-10 code for asthma?" }],
                  },
              },
          }
    A2AJSONRPCResponse:
      type: object
      description: A JSON-RPC 2.0 response envelope.
      required: [jsonrpc, id]
      properties:
        jsonrpc:
          {
            const: "2.0",
            description: JSON-RPC protocol version; always `2.0`.,
          }
        id:
          oneOf:
            - { type: string }
            - { type: integer }
            - { type: "null" }
          examples: [msg-001, 42, null]
        result:
          {
            type: object,
            additionalProperties: true,
            description: JSON-RPC result object (present on success).,
            example:
              { task: { id: task.0192f4c8-4e7c-7d50-b13c-5eaf8a4d9c62 } },
          }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: integer, description: JSON-RPC error code. }
            message:
              { type: string, description: Human-readable error message. }
            data:
              {
                type: object,
                additionalProperties: true,
                description: Additional error details.,
              }
          description: JSON-RPC error object (present on failure).
          examples: [{ code: -32600, message: Invalid Request }]
    FeedbackRatingScale:
      type: string
      description: "The scale on which the rating was collected.

        - `binary` — 0 (negative) or 1 (positive).


        Planned (not yet available): `likert5` (integer 1–5), `continuous01` (number 0–1).

        "
      enum: [binary]
    FeedbackLabel:
      type: string
      description:
        "Structured observation about the result. Positive and negative labels

        share one taxonomy so customers can represent mixed feedback.

        - `correct` — factually and contextually correct (positive).

        - `complete` — included the important expected information (positive).

        - `helpful` — materially helped the user complete their task (positive).

        - `wellPresented` — clear, readable, appropriately structured (positive).

        - `efficient` — reached a useful result without unnecessary content (positive).

        - `incorrect` — one or more claims, conclusions, or actions were wrong (negative).

        - `missingInformation` — important or expected information was omitted (negative).

        - `irrelevant` — included content that did not address the request (negative).

        - `misunderstoodRequest` — the system responded to the wrong intent (negative).

        - `unsupportedClaim` — a claim not supported by available information (negative).

        - `unsafeOrInappropriate` — unsafe, disallowed, or unsuitable (negative).

        - `poorlyPresented` — difficult to read or unsuitably structured (negative).

        - `tooVerbose` — substantially more detail than useful (negative).

        - `other` — another observation described in `reason` (both).

        "
      enum:
        [
          correct,
          complete,
          helpful,
          wellPresented,
          efficient,
          incorrect,
          missingInformation,
          irrelevant,
          misunderstoodRequest,
          unsupportedClaim,
          unsafeOrInappropriate,
          poorlyPresented,
          tooVerbose,
          other,
        ]
    FeedbackRating:
      type: object
      description: The original rating supplied by the customer.
      required: [scale, value]
      properties:
        scale: { $ref: "#/components/schemas/FeedbackRatingScale" }
        value:
          {
            type: number,
            format: double,
            description: The rating value on the selected scale.,
          }
      additionalProperties: false
      examples:
        - scale: binary
          value: 1
    FeedbackTarget:
      type: object
      description:
        "Identifies the specific user-visible response being evaluated. If

        omitted, the feedback applies to the task as a whole.

        "
      required: [messageId]
      properties:
        messageId: { $ref: "#/components/schemas/CommonMessageIDValue" }
      additionalProperties: false
    FeedbackActor:
      type: object
      description: Customer-defined opaque identifier for the feedback submitter.
      required: [externalId]
      properties:
        externalId:
          {
            type: string,
            maxLength: 255,
            description:
              "Scoped to the authenticated customer; not globally unique and not

              independently verified. Should preferably be pseudonymous and must

              not contain names, emails, national identifiers, or medical record

              numbers.

              ",
          }
      additionalProperties: false
    FeedbackMetadata:
      type: object
      description: Customer-provided provenance and correlation information.
      required: []
      properties:
        collectionMethod:
          type: string
          maxLength: 100
          description: How the customer collected the feedback. Informational only; does not affect rating validation or normalization.
          examples: [thumbs, survey]
        clientReference:
          {
            type: string,
            maxLength: 255,
            description:
              "Customer-defined reference to correlate the feedback with an object

              in the customer's own system. Not unique and does not provide

              idempotency. Should not contain sensitive information.

              ",
          }
        actor: { $ref: "#/components/schemas/FeedbackActor" }
      additionalProperties: false
    FeedbackCreateRequest:
      type: object
      description: Request body for submitting task feedback.
      required: [rating]
      properties:
        rating: { $ref: "#/components/schemas/FeedbackRating" }
        labels:
          type: array
          description:
            "Structured observations about the result. Defaults to an empty array.

            Positive and negative labels may be combined. Duplicate labels are

            rejected. A maximum of five labels may be submitted.

            "
          items: { $ref: "#/components/schemas/FeedbackLabel" }
          maxItems: 5
          uniqueItems: true
          default: []
        reason:
          {
            type: string,
            maxLength: 1000,
            description:
              "The user's explanation of the rating or labels. Required when `labels`

              contains `other`.

              ",
            examples:
              [
                The response stated the patient had diabetes,
                but this was not present in the available data.,
              ],
          }
        target: { $ref: "#/components/schemas/FeedbackTarget" }
        metadata: { $ref: "#/components/schemas/FeedbackMetadata" }
      additionalProperties: false
    FeedbackResponse:
      type: object
      description: A stored feedback resource.
      required: [id, taskId, rating, normalizedScore, labels, createdAt]
      properties:
        id: { $ref: "#/components/schemas/FeedbackIDValue" }
        taskId: { $ref: "#/components/schemas/CommonTaskIDValue" }
        rating: { $ref: "#/components/schemas/FeedbackRating" }
        normalizedScore:
          {
            type: number,
            format: double,
            minimum: 0,
            maximum: 1,
            description:
              "Corti-derived internal score between 0 and 1. The original scale and

              value are always retained alongside this score.

              ",
            example: 1.0,
          }
        labels:
          type: array
          items: { $ref: "#/components/schemas/FeedbackLabel" }
          description: Structured observations about the result.
          examples: [[correct, helpful]]
        reason:
          {
            type: string,
            maxLength: 1000,
            description: Free-text explanation of the rating or labels.,
            examples:
              [
                The response stated the patient had diabetes,
                but this was not present in the available data.,
              ],
          }
        target: { $ref: "#/components/schemas/FeedbackTarget" }
        metadata: { $ref: "#/components/schemas/FeedbackMetadata" }
        createdAt:
          {
            type: string,
            format: date-time,
            readOnly: true,
            description: When the feedback was created.,
            example: "2026-05-19T12:00:00Z",
          }
    FeedbackListResponse:
      type: object
      description: All feedback resources for a task, newest-first. Feedback is scoped to the authenticated user via row-level security.
      required: [feedbacks]
      properties:
        feedbacks:
          type: array
          items: { $ref: "#/components/schemas/FeedbackResponse" }
          description: Feedback resources for the task.
    CommonErrorResponse:
      type: object
      description: "Corti management-plane error envelope, used by all non-A2A endpoints.\n\n- **Standard** — when the error chain contains at least one `PublicError`,\n  `code` and `message` come from the outermost `PublicError` and `details`\n  is merged across the whole chain (outer values take precedence).\n- **Fallback** — when the chain contains no `PublicError`, the response is\n  a generic `500` carrying a `requestId` for support reference.\n- **Validation** — a single `PublicError` whose `details.validationErrors`\n  lists the offending fields.\n\nField names use camelCase on the wire (e.g. `requestId`, `howToFix`).\nThe free-form `details` object may carry arbitrary caller-defined keys.\n\nRate limiting (HTTP 429) is not yet implemented; the server does not emit a 429 response.\n"
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable, machine-readable, SCREAMING_SNAKE_CASE error code.
              examples: [ASSIGNMENT_CONFLICT, VALIDATION_FAILED, INTERNAL_ERROR]
            message: { type: string, description: Human-readable explanation. }
            howToFix:
              {
                type: string,
                description: Optional guidance for the caller to resolve the error.,
              }
            details:
              type: object
              description:
                "Structured context, merged from every `PublicError` in the chain

                (outer values win). Omitted on the generic fallback response.

                "
              additionalProperties: true
              properties:
                validationErrors:
                  type: array
                  description: Present when `code` is `VALIDATION_FAILED`.
                  items:
                    type: object
                    required: [field, reason]
                    properties:
                      field:
                        {
                          type: string,
                          description: The field that failed validation.,
                        }
                      reason:
                        {
                          type: string,
                          description: Why the field failed validation.,
                        }
            requestId:
              {
                type: string,
                description:
                  "Correlation ID from request middleware. Included only on the

                  generic `500` fallback so consumers can quote it in support requests.

                  ",
              }
          description: The error object with code, message, and optional details.
      examples:
        - error:
            code: ASSIGNMENT_CONFLICT
            message: could not complete assignment
            details: { assignment_id: asg_99, expert_id: exp_42 }
        - error:
            code: VALIDATION_FAILED
            message: validation failed
            details:
              validationErrors:
                - { field: email, reason: invalid format }
                - { field: name, reason: required }
        - error:
            {
              code: INTERNAL_ERROR,
              message: internal server error,
              requestId: req_abc123,
            }
    A2AErrorResponse:
      type: object
      description:
        "Google-RPC-style error envelope mandated by the A2A `HTTP+JSON` binding.

        "
      required: [error]
      properties:
        error:
          type: object
          required: [code, status, message]
          properties:
            code: { type: integer, description: HTTP status code. }
            status:
              type: string
              description: Canonical google.rpc status.
              examples: [NOT_FOUND]
            message:
              { type: string, description: Human-readable error message. }
            details:
              type: array
              items: { type: object, additionalProperties: true }
              description: Additional error details (google.rpc.Status details).
          description: Google-RPC-style error object with code, status, and message.
      examples:
        - error:
            code: 404
            status: NOT_FOUND
            message: Task not found.
            details:
              - "@type": type.googleapis.com/google.rpc.ErrorInfo
                reason: TASK_NOT_FOUND
                domain: a2a-protocol.org
                metadata: { taskId: task.0192f4c8-4e7c-7d50-b13c-5eaf8a4d9c62 }
    CommonUsage:
      type: object
      description:
        "Token and credit accounting for a task, following the conventions used by

        major LLM providers. `inputTokens`/`outputTokens` count the prompt and

        completion respectively; `cachedInputTokens` is the subset of

        `inputTokens` served from the provider's prompt cache (a discount, not an

        addition), and `cacheCreationInputTokens` is the surcharge paid to

        *write* the cache. `totalTokens` is the all-in count. `credits` is the

        Corti billing unit charged for the task.

        "
      required: [inputTokens, outputTokens, totalTokens]
      properties:
        model:
          type: string
          description: The model identifier that served the request.
          examples: [corti-default]
        inputTokens:
          type: integer
          format: int64
          minimum: 0
          description: Prompt tokens consumed.
          examples: [100]
        outputTokens:
          type: integer
          format: int64
          minimum: 0
          description: Completion tokens produced.
          examples: [20]
        cachedInputTokens:
          type: integer
          format: int64
          minimum: 0
          description: Subset of `inputTokens` served from the prompt cache (cache read).
          examples: [64]
        cacheCreationInputTokens:
          type: integer
          format: int64
          minimum: 0
          description: Input tokens written to the prompt cache (cache-write surcharge).
          examples: [0]
        totalTokens:
          type: integer
          format: int64
          minimum: 0
          description: Total tokens billed (`inputTokens` + `outputTokens`).
          examples: [120]
        credits:
          type: number
          format: double
          minimum: 0
          description: Corti billing credits charged for the task.
          examples: [1.2]
      examples:
        - {
            model: corti-default,
            inputTokens: 100,
            outputTokens: 20,
            cachedInputTokens: 64,
            cacheCreationInputTokens: 0,
            totalTokens: 120,
            credits: 1.2,
          }
    CommonTaskMetadata:
      type: object
      description:
        "Free-form A2A task metadata. Corti's first-party keys are prefixed with

        `$` (à la Mixpanel) to set them apart from caller-supplied keys. Token and

        credit accounting is carried under `$usage`. Arbitrary additional keys are

        permitted.

        "
      required: []
      properties:
        $usage: { $ref: "#/components/schemas/CommonUsage" }
      additionalProperties: true
    CommonNextPageToken:
      type: ["string", "null"]
      description: Opaque cursor to request the next page, or `null` if there are no more pages.
    CommonTotalSize:
      {
        type: integer,
        description: "Total number of items matching the query, when known. Not currently populated by the server; treat as absent.",
        example: 42,
      }
  examples:
    AgentCreateExample:
      summary: Create a coding agent
      description: A persistent coding agent with a registry expert, an MCP connector, and a schema tool that validates the LLM's structured response against a JSON schema and ends the turn.
      value:
        name: coder
        description: Returns ICD-10 codes for a clinical encounter.
        systemPrompt: Respond with only the ICD-10 code.
        model: corti-default
        visibility: private
        lifecycle: persistent
        connectors:
          - { type: registry, name: "@dedalus/coding-expert" }
          - type: mcp
            name: policybot
            url: https://mcp.example.com
            auth:
              {
                type: oauth2,
                scope: "read:policies",
                redirectUrl: "https://app.corti.ai/oauth/callback",
              }
          - type: schema
            name: submit_code
            description: Submit the final ICD-10 code for the encounter along with a confidence score.
            transition: complete
            schema:
              type: object
              properties:
                code: { type: string, description: The selected ICD-10 code. }
                confidence: { type: number, minimum: 0, maximum: 1 }
              required: [code]
        labels: { team: coding, env: prod }
    AgentCardExample:
      summary: A2A v1.0 agent card
      description: A discovery card advertising both the JSONRPC and HTTP+JSON v1.0 interfaces.
      value:
        name: coder
        description: Returns ICD-10 codes for a clinical encounter.
        version: 0.1.0
        capabilities: { streaming: true, pushNotifications: false }
        defaultInputModes: [text/plain]
        defaultOutputModes: [text/plain]
        provider: { organization: Corti, url: "https://corti.ai" }
        skills:
          - id: con.0192f4c8-7baf-7083-a46f-81d2bd70cf95
            name: coding-expert
            description: ICD-10 coding.
            tags: [expert]
        supportedInterfaces:
          - {
              protocolBinding: JSONRPC,
              protocolVersion: "1.0",
              url: "https://api.eu.corti.app/v2/agentic/agents/agt.0192f4c8-2c5a-7b3e-9f1a-3c8d6e2b7a40/a2a",
            }
          - {
              protocolBinding: HTTP+JSON,
              protocolVersion: "1.0",
              url: "https://api.eu.corti.app/v2/agentic/agents/agt.0192f4c8-2c5a-7b3e-9f1a-3c8d6e2b7a40/a2a",
            }
    SendMessageResponseExample:
      summary: Completed task
      description: A non-streaming SendMessage (returnImmediately=false) that resolves to a completed task with one artifact.
      value:
        task:
          id: task.0192f4c8-4e7c-7d50-b13c-5eaf8a4d9c62
          contextId: ctx.0192f4c8-3d6b-7c4f-a02b-4d9e7f3c8b51
          status:
