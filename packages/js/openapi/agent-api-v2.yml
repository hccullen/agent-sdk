              }
    FeedbackCreateMinimalExample:
      summary: Minimal binary positive rating
      description: The simplest possible feedback — a positive binary rating with no labels or reason.
      value:
        rating: { scale: binary, value: 1 }
    FeedbackCreateDetailedExample:
      summary: Detailed report about a message
      description: A negative binary rating with labels, reason, message target, and full metadata.
      value:
        rating: { scale: binary, value: 0 }
        labels: [unsupportedClaim]
        reason: The response stated that the patient had diabetes, but this was not present in the available data.
        target: { messageId: msg.0192f4c8-5f8d-7e61-924d-6fb09b5ead73 }
        metadata:
          collectionMethod: caseReview
          clientReference: case-review-728193
          actor: { externalId: clinician_4182 }
